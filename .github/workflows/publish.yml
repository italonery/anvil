name: Build, Test & Publish Anvil Packages

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build, Test & Publish (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Anvil.slnx

      - name: Build solution (Release)
        run: dotnet build Anvil.slnx -c Release --no-restore

      - name: Run Architecture & Unit Tests
        run: dotnet test Anvil.slnx -c Release --no-build --verbosity normal

      - name: Pack NuGet packages
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            PACKAGE_VERSION="${GITHUB_REF#refs/tags/v}"
            dotnet pack Anvil.slnx -c Release --no-build -p:Version="${PACKAGE_VERSION}" --output "${RUNNER_TEMP}/packages"
          else
            dotnet pack Anvil.slnx -c Release --no-build --output "${RUNNER_TEMP}/packages"
          fi

      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: >
          dotnet nuget push "${RUNNER_TEMP}/packages/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
